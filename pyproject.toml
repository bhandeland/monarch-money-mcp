[project]
name = "monarch-money-mcp"
version = "0.1.1"
description = "MCP server for MonarchMoney financial data access"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "gql>=4.0.0",
    "graphql-core>=3.2.12",
    "mcp>=2.2.0",
    "monarchmoneycommunity>=1.5.2",
]

[project.scripts]
monarch-money-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "auth.py", "install.py", "monarch_gql.py"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pyrefly]
preset = "strict"
project-includes = ["*.py", "tests"]
python-interpreter-path = ".venv/bin/python"

# Literal {} / [] test data (mock return values, tool arguments) is fine untyped.
[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { implicit-any-empty-container = false }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --no-header --tb=short -p no:cacheprovider"
filterwarnings = ["error"]
